<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Estilo para que el scrollbar sea invisible (como pedía 'scrollbar-none') -->
    <style>
      .scrollbar-none {
        -ms-overflow-style: none; /* IE y Edge */
        scrollbar-width: none; /* Firefox */
      }
      .scrollbar-none::-webkit-scrollbar {
        display: none; /* Chrome, Safari y Opera */
      }
    </style>
  </head>
  <body class="dark:bg-gray-900">
    <div class="min-h-screen text-gray-900 dark:text-gray-100">
      <!-- ===== HEADER (BARRA DE NAVEGACIÓN FIJA) ===== -->
      <header
        class="sticky top-0 z-40 border-b border-gray-200/60 dark:border-gray-800/80 bg-white/75 dark:bg-gray-950/60 backdrop-blur"
      >
        <div class="mx-auto max-w-7xl px-4 h-14 flex items-center gap-3">
          <div class="flex items-center gap-2">
            <img
              src="https://placehold.co/40x40/000000/FFF?text=P"
              alt="Logotipo"
              class="h-9 w-auto rounded-md select-none"
              draggable="false"
            />
            <span class="hidden sm:inline text-sm font-semibold tracking-tight">
              Panel de usuario
            </span>
          </div>

          <div class="ml-auto flex items-center gap-1">
            <button
              type="button"
              aria-label="Abrir cuenta"
              class="inline-flex items-center justify-center h-9 w-9 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400 focus-visible:ring-offset-2 focus-visible:ring-offset-white dark:focus-visible:ring-offset-gray-950 transition"
            >
              <i class="bi bi-three-dots-vertical"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- ===== CONTENEDOR PRINCIPAL ===== -->
      <main>
        <!-- ===== COMPONENTE 1: SELECTOR DE MASCOTAS ===== -->
        <div class="mx-auto max-w-7xl px-4 py-3">
          <div
            id="pet-selector-container"
            class="relative flex gap-2 overflow-x-auto scrollbar-none rounded-2xl p-2 bg-white/60 dark:bg-gray-950/50 ring-1 ring-black/10 dark:ring-white/10 backdrop-blur"
            aria-label="Selector de mascotas"
          >
            <!-- Los botones de las mascotas se insertarán aquí con JavaScript -->
          </div>
        </div>

        <!-- ===== COMPONENTE 2: DETALLES DE LA MASCOTA ===== -->
        <section
          id="pet-details-container"
          class="relative mx-auto max-w-7xl px-4 py-6"
        >
          <!-- El perfil de la mascota activa se insertará aquí con JavaScript -->
        </section>
      </main>
    </div>

    <!-- ===== LÓGICA DE JAVASCRIPT ===== -->
    <script>
      // --- ESTADO GLOBAL DE LA APLICACIÓN ---
      const petItems = [
        {
          id: "1",
          name: "Kira",
          img: "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=400&h=400&fit=crop",
          breed: "Golden Retriever",
          type: "Perro",
          color: "Dorado",
          lostMode: false,
          tagActive: true,
          tagId: "A-123",
          lastScanText: "Hace 2 horas",
          lastScan: new Date(),
          lastScanCity: "Ciudad de México",
          lastScanWhen: "hoy a las 10:30 AM",
        },
        {
          id: "2",
          name: "Max, el destructor",
          img: "https://images.unsplash.com/photo-1583512603805-3cc6b41f3edb?w=400&h=400&fit=crop",
          breed: "Bulldog Francés",
          type: "Perro",
          color: "Blanco y negro",
          lostMode: true,
          tagActive: true,
          tagId: "B-456",
          lastScanText: "Ayer",
          lastScan: new Date(Date.now() - 86400000),
          lastScanCity: "Guadalajara",
          lastScanWhen: "ayer a las 5:15 PM",
        },
        {
          id: "3",
          name: "Rocky",
          img: null, // Mascota sin imagen
          breed: "Mestizo",
          type: "Gato",
          color: "Naranja",
          lostMode: false,
          tagActive: false, // Placa sin vincular
          tagId: null,
          lastScanText: "Nunca",
          lastScan: null, // Sin escaneos
          lastScanCity: null,
          lastScanWhen: null,
        },
      ];
      let activeId = "1"; // El ID de la mascota activa

      // --- FUNCIONES DE RENDERIZADO (Helpers) ---

      /** Reemplaza al componente <QuickAction /> de React */
      function createQuickActionHTML(iconName, label, onclickAction) {
        return `
                <button
                    type="button"
                    onclick="${onclickAction}"
                    class="
                        group relative flex w-full items-center gap-3 rounded-2xl p-3
                        bg-white/70 ring-1 ring-black/10
                        dark:bg-gray-900/70 dark:ring-white/10
                        hover:-translate-y-0.5 hover:shadow-lg transition
                        focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400
                        focus-visible:ring-offset-2 focus-visible:ring-offset-white dark:focus-visible:ring-offset-gray-950
                    "
                >
                    <span class="
                        grid h-10 w-10 place-items-center rounded-xl text-lg
                        bg-white dark:bg-gray-800
                        ring-1 ring-black/5 dark:ring-white/10
                        shadow-sm
                    ">
                        <i class="bi bi-${iconName}"></i>
                    </span>
                    <span class="text-sm font-semibold">${label}</span>
                    <i class="bi bi-chevron-right ml-auto text-sm opacity-50"></i>
                </button>
            `;
      }

      // --- FUNCIÓN PRINCIPAL DE RENDERIZADO ---
      function renderUI() {
        const petSelectorContainer = document.getElementById(
          "pet-selector-container"
        );
        const petDetailsContainer = document.getElementById(
          "pet-details-container"
        );

        // Limpiamos los contenedores
        petSelectorContainer.innerHTML = "";
        petDetailsContainer.innerHTML = "";

        // --- 1. RENDERIZAR EL SELECTOR DE MASCOTAS ---
        petItems.forEach((pet) => {
          const isActive = pet.id === activeId;
          const buttonClasses = `
                    group flex-shrink-0 flex items-center gap-2 px-3 py-2 rounded-xl transition
                    focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400
                    focus-visible:ring-offset-2 focus-visible:ring-offset-white dark:focus-visible:ring-offset-gray-950
                    ${
                      isActive
                        ? `text-white shadow bg-gradient-to-r from-emerald-500 via-sky-500 to-fuchsia-500 ring-0`
                        : `bg-white/75 dark:bg-gray-900/70 ring-1 ring-black/10 dark:ring-white/10 hover:-translate-y-0.5 hover:shadow`
                    }
                `;
          const imageClasses = `h-7 w-7 rounded-lg object-cover ring-1 ${
            isActive ? "ring-white/30" : "ring-black/10 dark:ring-white/10"
          }`;
          const initialClasses = `h-7 w-7 grid place-items-center rounded-lg text-[11px] font-semibold ${
            isActive
              ? "bg-white/25 text-white"
              : "bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-200"
          }`;
          const nameClasses = `text-sm font-medium truncate max-w-[9rem] ${
            isActive ? "text-white" : "text-gray-900 dark:text-gray-100"
          }`;

          const avatarHtml = pet.img
            ? `<img src="${pet.img}" alt="${pet.name}" class="${imageClasses}" draggable="false" />`
            : `<span aria-hidden="true" class="${initialClasses}">${pet.name
                .slice(0, 1)
                .toUpperCase()}</span>`;

          const petButtonHTML = `
                    <button
                        type="button"
                        onclick="handlePetChange('${pet.id}')"
                        aria-label="Mascota ${pet.name}"
                        class="${buttonClasses.trim()}"
                    >
                        ${avatarHtml}
                        <span class="${nameClasses}" title="${pet.name}">
                            ${pet.name}
                        </span>
                    </button>
                `;
          petSelectorContainer.innerHTML += petButtonHTML;
        });

        // Botón "Nuevo" del selector
        const newButtonHTML = `
                <button
                    type="button"
                    onclick="handleNewPet()"
                    class="group relative inline-flex items-center gap-2 rounded-xl p-[2px] bg-gradient-to-r from-emerald-400 via-sky-400 to-fuchsia-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400 focus-visible:ring-offset-2 focus-visible:ring-offset-white dark:focus-visible:ring-offset-gray-950 transition hover:brightness-110 active:translate-y-[1px]"
                >
                    <span class="inline-flex items-center gap-2 rounded-[inherit] px-3 py-2 bg-white/80 dark:bg-gray-900/80 backdrop-blur text-sm font-semibold text-gray-900 dark:text-gray-100 ring-1 ring-black/10 dark:ring-white/10 shadow-[0_8px_20px_rgba(0,0,0,0.12)]">
                        <span class="inline-grid h-6 w-6 place-items-center rounded-lg bg-gray-100 dark:bg-gray-800 ring-1 ring-black/10 dark:ring-white/10">
                            <i class="bi bi-plus-lg text-base"></i>
                        </span>
                        Nuevo
                    </span>
                    <span aria-hidden="true" class="pointer-events-none absolute -inset-1 rounded-2xl opacity-0 group-hover:opacity-60 blur-lg transition bg-gradient-to-r from-emerald-400/70 via-sky-400/70 to-fuchsia-500/70"></span>
                </button>
            `;
        petSelectorContainer.innerHTML += newButtonHTML;

        // --- 2. RENDERIZAR LOS DETALLES DE LA MASCOTA ACTIVA ---
        const activePet = petItems.find((p) => p.id === activeId);
        if (!activePet) {
          petDetailsContainer.innerHTML = `<p class="text-center">Mascota no encontrada.</p>`;
          return;
        }

        // Renderizado condicional de la imagen de perfil
        const profileImgHtml = activePet.img
          ? `<img src="${activePet.img}" alt="${activePet.name}" loading="lazy" class="h-full w-full object-cover" draggable="false" />`
          : `<div class="grid h-full w-full place-items-center text-4xl font-bold text-gray-400">${activePet.name
              .slice(0, 1)
              .toUpperCase()}</div>`;

        // Renderizado condicional del botón "Modo Extravío"
        const lostModeButtonClasses = `
                inline-flex items-center gap-2 rounded-xl px-4 py-2 transition
                focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400
                focus-visible:ring-offset-2 focus-visible:ring-offset-white dark:focus-visible:ring-offset-gray-950
                ${
                  activePet.lostMode
                    ? "bg-amber-600 text-white hover:bg-amber-700"
                    : "bg-white/70 dark:bg-white/10 text-gray-900 dark:text-white ring-1 ring-black/10 dark:ring-white/10 hover:-translate-y-0.5 hover:shadow"
                }
            `;
        const lostModeIcon = activePet.lostMode
          ? "bi-exclamation-triangle-fill"
          : "bi-shield-check";
        const lostModeText = activePet.lostMode
          ? "Modo extravío activo"
          : "Modo extravío desactivado";

        // Renderizado condicional de la placa
        const tagBadgeClasses = `
                inline-flex items-center gap-2 rounded-xl px-3 py-1.5 text-sm
                ${
                  activePet.tagActive
                    ? "bg-emerald-600 text-white"
                    : "bg-amber-600 text-white"
                }
            `;
        const tagBadgeText = activePet.tagActive
          ? `Placa activa${activePet.tagId ? ` · ID ${activePet.tagId}` : ""}`
          : "Placa sin vincular";

        // Renderizado condicional de la última actividad
        const activityHtml = activePet.lastScan
          ? `
                    <ul class="space-y-1 text-sm opacity-85">
                        <li class="flex flex-wrap items-center gap-2">
                            <span class="inline-flex items-center gap-1">
                                <i class="bi bi-geo-alt-fill"></i>
                                ${
                                  activePet.lastScanCity ??
                                  "Ubicación no disponible"
                                }
                            </span>
                            <span class="opacity-50">·</span>
                            ${activePet.lastScanWhen ?? "—"}
                        </li>
                    </ul>
                `
          : `<div class="text-sm opacity-80">Sin actividad todavía</div>`;

        const detailsHTML = `
                <div class="
                    relative overflow-hidden rounded-3xl ring-1
                    ring-black/10 dark:ring-white/10
                    bg-gradient-to-br
                    from-teal-200/50 via-sky-200/40 to-fuchsia-200/40
                    dark:from-fuchsia-900/30 dark:via-sky-900/20 dark:to-teal-900/30
                ">
                    <div class="grid items-stretch gap-4 md:grid-cols-[340px_1fr]">
                        
                        <!-- Columna izquierda: Foto + estado -->
                        <div class="p-6 md:p-8">
                            <div class="relative mx-auto h-52 w-52 overflow-hidden rounded-3xl bg-white/60 dark:bg-gray-900/60 ring-1 ring-black/10 dark:ring-white/10">
                                ${profileImgHtml}
                            </div>

                            <div class="mt-4 text-center">
                                <h2 class="text-2xl font-bold">${
                                  activePet.name
                                }</h2>
                                <p class="text-sm opacity-80">
                                    ${activePet.breed || activePet.type || "—"}
                                    ${
                                      activePet.color
                                        ? ` • ${activePet.color}`
                                        : ""
                                    }
                                </p>
                            </div>

                            <!-- Botón Modo Extravío -->
                            <div class="mt-4 flex justify-center">
                                <button
                                    type="button"
                                    onclick="handleToggleLost('${
                                      activePet.id
                                    }')"
                                    aria-pressed="${activePet.lostMode}"
                                    class="${lostModeButtonClasses.trim()}"
                                >
                                    <i class="bi ${lostModeIcon}"></i>
                                    ${lostModeText}
                                </button>
                            </div>
                        </div>

                        <!-- Columna derecha: Acciones / estado / actividad -->
                        <div class="p-4 md:p-6">
                            <div class="grid h-full content-start gap-4">
                                <!-- Badges de estado -->
                                <div class="flex flex-wrap gap-2">
                                    <span class="${tagBadgeClasses.trim()}">
                                        <i class="bi bi-qr-code"></i>
                                        ${tagBadgeText}
                                    </span>

                                    <span class="
                                        inline-flex items-center gap-2 rounded-xl bg-white/70 px-3 py-1.5 text-sm
                                        ring-1 ring-black/10 dark:bg-white/10 dark:ring-white/10
                                    ">
                                        <i class="bi bi-clock"></i>
                                        ${activePet.lastScanText}
                                    </span>
                                </div>

                                <!-- Acciones rápidas -->
                                <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
                                    ${createQuickActionHTML(
                                      "qr-code",
                                      "Ver QR / Vincular",
                                      "handleOpenModule('tag')"
                                    )}
                                    ${createQuickActionHTML(
                                      "heart-pulse",
                                      "Salud",
                                      "handleOpenModule('health')"
                                    )}
                                    ${createQuickActionHTML(
                                      "person-badge",
                                      "Perfil",
                                      "handleOpenModule('profile')"
                                    )}
                                </div>

                                <!-- Minilista de actividad -->
                                <div class="mt-2 rounded-2xl bg-white/70 p-3 ring-1 ring-black/10 dark:bg-gray-900/70 dark:ring-white/10">
                                    <div class="mb-2 flex items-center gap-2 text-sm font-semibold">
                                        <i class="bi bi-card-list"></i> Información adicional
                                    </div>
                                    ${activityHtml}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        petDetailsContainer.innerHTML = detailsHTML;
      }

      // --- MANEJADORES DE EVENTOS ---

      /** Se llama al hacer clic en un botón de mascota */
      function handlePetChange(id) {
        console.log("Mascota seleccionada:", id);
        activeId = id; // Actualiza el estado global
        renderUI(); // Vuelve a renderizar toda la UI
      }

      /** Se llama al hacer clic en "Nuevo" */
      function handleNewPet() {
        console.log("Añadir nueva mascota");
        // Aquí iría la lógica para añadir una nueva mascota y luego llamar a renderUI()
      }

      /** Se llama al hacer clic en el botón "Modo Extravío" */
      function handleToggleLost(petId) {
        const pet = petItems.find((p) => p.id === petId);
        if (pet) {
          pet.lostMode = !pet.lostMode; // Muta el estado
          console.log(`Modo extravío para ${pet.name}: ${pet.lostMode}`);
          renderUI(); // Vuelve a renderizar la UI para reflejar el cambio
        }
      }

      /** Se llama al hacer clic en una acción rápida */
      function handleOpenModule(moduleName) {
        console.log("Abrir módulo:", moduleName);
        // Aquí iría la lógica para mostrar un modal o cambiar de vista
      }

      // --- INICIALIZACIÓN ---
      // Renderiza la UI por primera vez cuando el documento esté listo
      document.addEventListener("DOMContentLoaded", renderUI);
    </script>
  </body>
</html>
